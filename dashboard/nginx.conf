server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/... -> backend:8080/... (trailing slash strips the /api prefix).
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}