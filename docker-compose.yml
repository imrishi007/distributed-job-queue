services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: djq
      POSTGRES_DB: jobqueue
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobqueue"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    environment: &djq
      DJQ_PG_DSN: "host=postgres dbname=jobqueue user=postgres password=djq"
      DJQ_REDIS_HOST: redis
      DJQ_BIND: "0.0.0.0:8080"
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: ["djq-worker"]
    restart: unless-stopped
    environment: *djq
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      replicas: 2

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata: